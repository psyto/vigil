[package]
name = "volatility-mining"
version = "0.1.0"
description = "Volatility mining rewards for restaking risk LPs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "volatility_mining"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
spl-token = "7"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
