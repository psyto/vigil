[package]
name = "ncn-oracle"
version = "0.1.0"
description = "NCN Performance and Yield Oracle for Restaking Risk Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ncn_oracle"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
